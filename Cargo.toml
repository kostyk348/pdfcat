[package]
name = "pdfcat"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Каталогизатор PDF на сетевом диске с полнотекстовым поиском (BM25). Zero deps, Windows 7."
license = "MIT"

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
